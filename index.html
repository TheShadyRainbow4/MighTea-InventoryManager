<body>

<div class="app-container">
    <div class="brand-logo-wrapper">
        <div class="brand-text-row">
            <span class="brand-text-coral">MighTea</span>
            <svg class="brand-bolt" viewBox="0 0 40 80" xmlns="http://www.w3.org/2000/svg">
                <path d="M 25 0 L 5 45 L 20 45 L 10 80 L 35 35 L 20 35 Z" fill="#F3C332" />
            </svg>
            <span class="brand-text-teal">Boba</span>
        </div>
        <div class="brand-pearls-row">
            <svg class="brand-pearl" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
                <circle cx="20" cy="20" r="18" fill="#52BFC1"/>
                <path d="M 10 15 Q 15 5 25 8" stroke="white" stroke-width="2.5" fill="transparent" stroke-linecap="round"/>
            </svg>
            <svg class="brand-pearl" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
                <circle cx="20" cy="20" r="18" fill="#F3C332"/>
                <path d="M 10 15 Q 15 5 25 8" stroke="white" stroke-width="2.5" fill="transparent" stroke-linecap="round"/>
            </svg>
            <svg class="brand-pearl" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
                <circle cx="20" cy="20" r="18" fill="#F16954"/>
                <path d="M 10 15 Q 15 5 25 8" stroke="white" stroke-width="2.5" fill="transparent" stroke-linecap="round"/>
            </svg>
        </div>
    </div>

    <div class="toolbar">
        <input type="text" id="searchInput" class="search-box" placeholder="Search inventory items..." onkeyup="filterList()">
        <div class="action-group">
            <button class="btn-3d btn-yellow" onclick="document.getElementById('importFile').click()" title="Import JSON File">Import Data</button>
            <input type="file" id="importFile" accept=".json" style="display: none;" onchange="importSession(event)">
            <button class="btn-3d btn-coral" onclick="exportSession()" title="Export JSON File">Export Data</button>
            <button class="btn-3d btn-teal" onclick="exportPDF()" title="Print to PDF">Save as PDF</button>
        </div>
    </div>

    <div class="inventory-wrapper" id="inventoryWrapper">
        </div>

    <div id="errorLog" class="error-log"></div>
</div>
    <script src="data/inventory.js"></script>
    <script src="data/categories.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
